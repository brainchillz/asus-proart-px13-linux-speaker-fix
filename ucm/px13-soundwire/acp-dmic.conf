# Internal digital microphones (ACP SoundWire) for the ASUS ProArt PX13
# (HN7306). Bundled verbatim from the distro sof-soundwire/acp-dmic.conf so
# the whole verb is self-contained and immune to alsa-ucm-conf updates.

SectionDevice."Mic" {
	Comment "Digital Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
		CaptureMixerElem "Mic ACP LED"
		CaptureSwitch "Mic ACP LED Capture Switch"
	}
}
