# Headphone/headset jack devices for the rt721-sdca codec of the ASUS
# ProArt PX13 (HN7306).
#
# Bundled copy of the distro sof-soundwire/rt721.conf, trimmed and pinned
# so alsa-ucm-conf package updates cannot break this machine. Past updates
# broke it twice:
#   - the "Headphone Switch" csets below reference a control this
#     codec/driver does not expose; their failure during the verb's
#     "disdevall" made `alsaucm set _verb HiFi` fail outright and dropped
#     PipeWire to a silent fallback profile (removed below);
#   - 1.2.15.3-1ubuntu1.7 renamed the guard variables
#     MultiMicShadow/MultiSpeakerShadow -> MicCodec1/SpeakerCodec1, which
#     broke parsing of anything including the distro file.
# The distro file's two If blocks create extra Mic/Speaker devices only on
# machines where rt721 doubles as the mic/speaker codec (guarded on those
# variables). Neither applies here - the amps are TAS2783 and the dmic is
# on the ACP - so the blocks are dropped entirely: no variable deps, no
# breakage on rename.

SectionDevice."Headphones" {
	Comment	"Headphones"

	EnableSequence [
	]

	DisableSequence [
	]

	Value {
	      PlaybackPriority 200
	      PlaybackPCM "hw:${CardId}"
	      JackControl "Headphone Jack"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='rt721 FU0F Capture Switch' 1"
	]

	DisableSequence [
		cset "name='rt721 FU0F Capture Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Headset Mic Jack"
		CaptureSwitch "rt721 FU0F Capture Switch"
		CaptureVolume "rt721 FU0F Capture Volume"
		CaptureMixerElem "rt721 FU0F"
	}
}
