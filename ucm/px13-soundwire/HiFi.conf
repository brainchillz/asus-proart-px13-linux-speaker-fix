# Self-contained HiFi verb for the ASUS ProArt PX13 (HN7306) amd-soundwire
# card. Installed to /usr/share/alsa/ucm2/px13-soundwire/HiFi.conf and
# referenced by the card override in conf.d/amd-soundwire/.
#
# Self-contained: all three codec device files are bundled in this
# directory (trimmed copies of the distro sof-soundwire/ ones) instead of
# being included from it. alsa-ucm-conf package updates have broken this
# machine's audio twice through the distro rt721.conf (unsupported
# "Headphone Switch" cset; MultiMicShadow/MultiSpeakerShadow variable
# rename), so nothing here references the distro directory anymore.
# The distro HiFi.conf is not used at all because its codec auto-detection
# cannot see this machine's TAS2783 amps (see the card override).

Syntax 8

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

<px13-soundwire/rt721.conf>
<px13-soundwire/acp-dmic.conf>
<px13-soundwire/tas2783.conf>
