# Self-contained HiFi verb for the ASUS ProArt PX13 (HN7306) amd-soundwire
# card. Installed to /usr/share/alsa/ucm2/px13-soundwire/HiFi.conf and
# referenced by the card override in conf.d/amd-soundwire/.
#
# Includes the distro codec device files directly (rt721 headset + acp-dmic
# + our tas2783 speaker) instead of going through the distro HiFi.conf,
# whose codec auto-detection cannot see this machine's TAS2783 amps (see
# the card override for details).

Syntax 8

# rt721.conf guards its optional extra devices on these; define them empty
# so the file parses standalone.
Define {
	MultiMicShadow ""
	MultiSpeakerShadow ""
}

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

<sof-soundwire/rt721.conf>
<sof-soundwire/acp-dmic.conf>
<sof-soundwire/tas2783.conf>
