# Speaker device for the TI TAS2783 SoundWire smart amp, used on
# (at least) the ASUS ProArt PX13 (HN7306, Strix Halo). Upstream
# alsa-ucm-conf has no codec profile for tas2783 yet, so this is a
# minimal local addition. PCM device 2 is the SmartAmp playback
# device exposed by the snd_acp_sdw_legacy_mach machine driver.
#
# The "RX Single Channel Switch" csets enable the stereo split of the
# two-amp pair (each mono amp claims one channel instead of both
# mirroring the left). That control only exists with the patched codec
# module from ../driver - the If.ControlExists guards keep this profile
# working (in mirror mono) with the stock in-tree module.

SectionDevice."Speaker" {
	Comment "Speaker"

	If.rxsc1 {
		Condition {
			Type ControlExists
			Control "name='tas2783-1 RX Single Channel Switch'"
		}
		True {
			EnableSequence [
				cset "name='tas2783-1 RX Single Channel Switch' 1"
			]
		}
	}

	If.rxsc2 {
		Condition {
			Type ControlExists
			Control "name='tas2783-2 RX Single Channel Switch'"
		}
		True {
			EnableSequence [
				cset "name='tas2783-2 RX Single Channel Switch' 1"
			]
		}
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
	}
}
