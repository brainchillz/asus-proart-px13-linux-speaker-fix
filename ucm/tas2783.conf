# Speaker device for the TI TAS2783 SoundWire smart amps.
#
# Upstream alsa-ucm-conf has no tas2783 codec profile, so this is a local
# addition. PCM device 2 is the SmartAmp playback device exposed by the
# snd_acp_sdw_legacy_mach machine driver ("SDW1-PIN1-PLAYBACK-SmartAmp").
#
# This card exposes no plain 'Speaker Switch'. The two TAS2783 amps are
# unmuted through per-amp controls: 'Left/Right Spk Switch' (amp 1) and
# 'Left/Right Spk2 Switch' (amp 2). A board with a different amp count
# would need this sequence adjusted; fix-px13-audio.sh verifies the
# controls exist and warns if they do not.

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
		cset "name='Left Spk2 Switch' on"
		cset "name='Right Spk2 Switch' on"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Left Spk2 Switch' off"
		cset "name='Right Spk2 Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
	}
}
