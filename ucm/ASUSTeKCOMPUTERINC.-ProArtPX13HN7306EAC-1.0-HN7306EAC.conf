# ALSA UCM card override for the ASUS ProArt PX13 (HN7306) "amd-soundwire"
# card. Installed to /usr/share/alsa/ucm2/conf.d/amd-soundwire/ under this
# file's exact name (= the card long-name), which makes UCM pick it instead
# of the generic sof-soundwire.conf.
#
# Why this exists: the distro sof-soundwire.conf auto-detects codecs by
# regexing the card's components string for " spk:<codec>" tokens. This
# machine's legacy AMD machine driver publishes only "cfg-amp:2 hs:rt721"
# (no spk: token), so SpeakerCodec1 resolves to "" and the distro's
# If.codec_default block then overwrites SpeakerCodecFile with that empty
# value - the HiFi verb ends up with no Speaker device and PipeWire falls
# back to "Dummy Output".
#
# Earlier revisions of this repo shipped a full copy of sof-soundwire.conf
# with a Define appended; that broke whenever alsa-ucm-conf updated
# (HiFi.conf started referencing ${var:SpeakerCodecFile}, which the copy
# never defined - UCM then failed to open the card at all). Instead we now
# ship a minimal, self-contained use case that includes only the codec
# device files we need.

Syntax 8

SectionUseCase."HiFi" {
	File "/px13-soundwire/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# Enable the dmic capture switches at boot (same as the distro config).
If.pga_init_pga2 {
	Condition {
		Type ControlExists
		Control "name='PGA2.0 2 Master Capture Switch'"
	}
	True.BootSequence [
		cset "name='PGA2.0 2 Master Capture Switch' 1"
	]
}

If.pga_init_pga5 {
	Condition {
		Type ControlExists
		Control "name='PGA5.0 5 Master Capture Switch'"
	}
	True.BootSequence [
		cset "name='PGA5.0 5 Master Capture Switch' 1"
	]
}
